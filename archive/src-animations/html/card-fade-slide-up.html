<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>card-fade-slide-up — CSS 3D Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; display: flex; flex-direction: column; align-items: center;
           justify-content: center; min-height: 100vh; font-family: system-ui; }
    .stage {
      width: 800px;
      height: 600px;
      perspective: 900px;
      perspective-origin: 50% 50%;
      position: relative;
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
    }
    .scene {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      position: relative;
    }
    .el {
      position: absolute;
      width: 120px;
      height: 160px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 12px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .controls { margin-top: 20px; display: flex; gap: 12px; }
    button {
      padding: 10px 24px; border: none; border-radius: 8px;
      background: #667eea; color: #fff; cursor: pointer; font-size: 14px;
    }
    button:hover { background: #764ba2; }
    .label { color: #666; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="scene">
    <div class="el" id="card" data-id="card"></div>
    </div>
  </div>
  <div class="controls">
    <button onclick="tl.play(0)">Play</button>
    <button onclick="tl.pause()">Pause</button>
    <button onclick="tl.reverse()">Reverse</button>
  </div>
  <p class="label">card-fade-slide-up — CSS 3D  |  1.2s @ 30fps</p>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.from("#card", { y: 120, duration: 1.2, ease: 'back.out(1.7)' }, 0);
    tl.from("#card", { opacity: 0, duration: 0.5, ease: 'power2.out' }, 0);
    tl.play();
  </script>
</body>
</html>
