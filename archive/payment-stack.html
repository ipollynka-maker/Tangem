<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Card Stack</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: #0A0A0F;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
}

/* Soft ambient bloom behind the stack */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 480px 400px at 50% 52%,
    rgba(60, 70, 190, 0.08) 0%, transparent 65%);
  pointer-events: none;
}

/* ── Layout ─────────────────────────────────────────────────── */
.wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 26px;
}

.eyebrow {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 3.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.22);
}

/* Stack container.
   overflow: visible so cards can exit above/below without clipping. */
.stack {
  position: relative;
  width: 320px;
  height: 220px;  /* tall enough to show the full peeking stack */
  overflow: visible;
}

/* ── Card ─────────────────────────────────────────────────────
   transform-origin: center bottom
   → scaling attaches to the bottom edge, so the visual bottom of
     every card stays at (y + CARD_H). This gives precise control
     over how much each card peeks below the one in front of it. */
.card {
  position: absolute;
  width: 320px;
  height: 140px;
  top: 0; left: 0;
  border-radius: 20px;
  background: #1C1C1E;
  border: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  will-change: transform;
  transform-origin: center bottom;
  overflow: hidden;
}

/* Subtle top-edge shimmer line */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 8%,
    rgba(255,255,255,0.08) 30%,
    rgba(255,255,255,0.12) 50%,
    rgba(255,255,255,0.08) 70%,
    transparent 92%);
}

/* ── Visa selected glow ─────────────────────────────────────── */
.card.is-selected {
  border-color: rgba(255,255,255,0.28);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.10),
    0 0  36px rgba(255,255,255,0.06),
    0 0  80px rgba(80, 100, 255, 0.06);
  transition: border-color 0.40s ease, box-shadow 0.40s ease;
}

/* ── Logo layouts ─────────────────────────────────────────────
   All logos live on dark cards, so text/SVG is light. ──────── */

/* Visa + Mastercard side-by-side */
.logo-visa-mc {
  display: flex;
  align-items: center;
  gap: 16px;
}

/* Apple Pay row */
.logo-applepay {
  display: flex;
  align-items: center;
  gap: 7px;
}
.ap-label {
  font-size: 24px;
  font-weight: 600;
  color: rgba(255,255,255,0.92);
  letter-spacing: -0.5px;
  line-height: 1;
}

/* ACH */
.logo-ach { text-align: center; }
.ach-main {
  font-size: 30px; font-weight: 800;
  color: rgba(255,255,255,0.90);
  letter-spacing: 6px; line-height: 1;
}
.ach-sub {
  margin-top: 5px; font-size: 9.5px; font-weight: 500;
  color: rgba(255,255,255,0.30);
  letter-spacing: 2px; text-transform: uppercase;
}

/* Wire */
.logo-wire { text-align: center; }
.wire-main {
  font-size: 26px; font-weight: 700;
  color: rgba(255,255,255,0.90); line-height: 1;
}
.wire-sub {
  margin-top: 5px; font-size: 9.5px; font-weight: 500;
  color: rgba(255,255,255,0.30);
  letter-spacing: 2px; text-transform: uppercase;
}

/* Blank placeholder card */
.logo-blank {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
}
.logo-blank span {
  display: block;
  height: 3px; border-radius: 2px;
  background: rgba(255,255,255,0.06);
}

/* ── Confirmation badge ──────────────────────────────────────── */
.badge {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,0.58);
  letter-spacing: 0.2px;
  /* GSAP sets opacity/y; no CSS transform here */
}
</style>
</head>
<body>

<div class="wrapper">
  <div class="eyebrow">Payment Method</div>

  <div class="stack" id="stack">

    <!-- ─── Card 0: Visa + Mastercard (selected at end) ─────── -->
    <div class="card" id="card-0">
      <div class="logo-visa-mc">
        <!-- Visa wordmark -->
        <svg width="108" height="44" viewBox="0 0 108 44" fill="none">
          <text x="2" y="38"
            font-family="Times New Roman, serif"
            font-style="italic" font-weight="900"
            font-size="42" fill="#2563EB" letter-spacing="-1">VISA</text>
        </svg>
        <!-- Mastercard overlapping circles -->
        <svg width="70" height="44" viewBox="0 0 70 44" fill="none">
          <circle cx="24" cy="22" r="21" fill="#EB001B"/>
          <circle cx="46" cy="22" r="21" fill="#F79E1B"/>
          <!-- Lens intersection -->
          <path d="M35 3.5
            C40.8 8 44.2 14.7 44.2 22
            C44.2 29.3 40.8 36 35 40.5
            C29.2 36 25.8 29.3 25.8 22
            C25.8 14.7 29.2 8 35 3.5Z"
            fill="#FF5F00"/>
        </svg>
      </div>
    </div>

    <!-- ─── Card 1: Apple Pay ───────────────────────────────── -->
    <div class="card" id="card-1">
      <div class="logo-applepay">
        <svg width="26" height="32" viewBox="0 0 814 1000" fill="rgba(255,255,255,0.90)">
          <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 405.8 15.7 303.2 15.7 204.8c0-158.1 103.3-241.9 204.8-241.9 52.7 0 96.6 34.5 129.5 34.5 31.3 0 80.3-36.5 140.1-36.5 22.3 0 108.2 1.9 163.7 74.6zm-234-181.5c31.3-37.5 53.3-89.5 53.3-141.5 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.1-55.1 135.8 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.3-69.4z"/>
        </svg>
        <span class="ap-label">Pay</span>
      </div>
    </div>

    <!-- ─── Card 2: ACH ─────────────────────────────────────── -->
    <div class="card" id="card-2">
      <div class="logo-ach">
        <div class="ach-main">ACH</div>
        <div class="ach-sub">Direct Deposit</div>
      </div>
    </div>

    <!-- ─── Card 3: Wire Transfer ───────────────────────────── -->
    <div class="card" id="card-3">
      <div class="logo-wire">
        <svg width="34" height="22" viewBox="0 0 34 22" fill="none"
          style="display:block;margin:0 auto 6px;">
          <circle cx="4" cy="11" r="2.8" fill="rgba(255,255,255,0.75)"/>
          <path d="M9.5 7a6.5 6.5 0 0 1 0 8"    stroke="rgba(255,255,255,0.70)" stroke-width="2" stroke-linecap="round"/>
          <path d="M14.5 3.5a12 12 0 0 1 0 15"   stroke="rgba(255,255,255,0.42)" stroke-width="2" stroke-linecap="round"/>
          <path d="M19.5 0.5a17 17 0 0 1 0 21"   stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <div class="wire-main">Wire</div>
        <div class="wire-sub">Transfer</div>
      </div>
    </div>

    <!-- ─── Card 4: Blank (placeholder back card) ───────────── -->
    <div class="card" id="card-4">
      <div class="logo-blank">
        <span style="width:80px;"></span>
        <span style="width:50px;"></span>
      </div>
    </div>

  </div><!-- /stack -->

  <!-- Confirmation badge — GSAP controls opacity and y -->
  <div class="badge" id="badge">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="8" r="7"
        fill="rgba(45,195,75,0.12)"
        stroke="rgba(45,195,75,0.78)"
        stroke-width="1.5"/>
      <path d="M5.2 8.4l2.1 1.9L11 6.2"
        stroke="rgba(45,195,75,0.88)"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
    </svg>
    Visa selected
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
// ─── Stack slot definitions ───────────────────────────────────────────────────
// Slot 0 = front/top. With transform-origin:center bottom, each card's
// VISUAL BOTTOM is fixed at (y + CARD_H), giving a predictable peek.
//   Slot 0 bottom: 0 + 140 = 140px  (front, full size)
//   Slot 1 bottom: 18 + 140 = 158px  → 18px peek below front card ✓
//   Slot 2 bottom: 36 + 140 = 176px  → 18px peek below slot 1 ✓
//   etc.
const POSITIONS = [
  { y:  0, scale: 1.00, zIndex: 50, opacity: 1.00 },
  { y: 18, scale: 0.94, zIndex: 40, opacity: 1.00 },
  { y: 36, scale: 0.88, zIndex: 30, opacity: 1.00 },
  { y: 54, scale: 0.82, zIndex: 20, opacity: 0.85 },
  { y: 72, scale: 0.76, zIndex: 10, opacity: 0.50 },
];

const N        = POSITIONS.length;              // 5
const cardEls  = Array.from({ length: N }, (_, i) => document.getElementById('card-' + i));

// slotToCard[slot] = card index at that slot. Slot 0 = front.
let slotToCard = [0, 1, 2, 3, 4];

// ─── Apply initial stack positions ───────────────────────────────────────────
slotToCard.forEach((cardIdx, slot) => {
  const p = POSITIONS[slot];
  gsap.set(cardEls[cardIdx], { y: p.y, scale: p.scale, zIndex: p.zIndex, opacity: p.opacity });
});

// Initialize badge (GSAP controls it from here on)
gsap.set('#badge', { opacity: 0, y: 8 });

// ─── Carousel config ─────────────────────────────────────────────────────────
const STEP_DUR    = 0.50;   // advance animation duration (s)
const PAUSE_DUR   = 0.40;   // hold time at each front position (s)
const TOTAL_STEPS = N * 2;  // 10 steps → 2 full cycles, Visa returns to front

let stepCount = 0;

// ─── Advance one step ────────────────────────────────────────────────────────
function advance() {
  if (stepCount >= TOTAL_STEPS) {
    gsap.delayedCall(PAUSE_DUR, triggerSelection);
    return;
  }

  const exitIdx = slotToCard[0];   // card index currently at front
  const exitEl  = cardEls[exitIdx];

  // Pre-assign z-indexes to the NEXT state so advancing cards are
  // already in the correct draw order during animation.
  const future = [...slotToCard.slice(1), slotToCard[0]]; // rotate preview
  future.forEach((cardIdx, slot) => {
    gsap.set(cardEls[cardIdx], { zIndex: POSITIONS[slot].zIndex });
  });
  gsap.set(exitEl, { zIndex: 100 }); // exiting card stays above everything during its upward flight

  // ① Exit: front card slides up and fades out
  gsap.to(exitEl, {
    y:       -50,
    opacity:  0,
    scale:    1.01, // slight expansion as it "launches" forward
    duration: STEP_DUR * 0.42,
    ease:     'power2.in',

    onComplete() {
      // Rotate slotToCard: front card moves to the back slot
      slotToCard.push(slotToCard.shift());

      // Instantly reposition exiting card at back (invisible; it will fade in)
      const backPos = POSITIONS[N - 1];
      gsap.set(exitEl, {
        y:       backPos.y,
        scale:   backPos.scale,
        zIndex:  backPos.zIndex,
        opacity: 0,
      });

      // ② Advance: all remaining cards slide toward the front
      slotToCard.forEach((cardIdx, slot) => {
        const p  = POSITIONS[slot];
        const el = cardEls[cardIdx];

        if (cardIdx === exitIdx) {
          // Exiting card fades in quietly at the back once stack settles
          gsap.to(el, {
            opacity:  p.opacity,
            duration: STEP_DUR * 0.55,
            delay:    STEP_DUR * 0.45,
            ease:     'power1.out',
          });
        } else {
          gsap.to(el, {
            y:       p.y,
            scale:   p.scale,
            opacity: p.opacity,
            duration: STEP_DUR,
            ease:    'power2.inOut',
          });
        }
      });

      stepCount++;
      gsap.delayedCall(STEP_DUR + PAUSE_DUR, advance);
    },
  });
}

// Brief initial pause so the user sees the starting stack, then go
gsap.delayedCall(PAUSE_DUR, advance);

// ─── Selection phase ──────────────────────────────────────────────────────────
// After 10 steps slotToCard = [0,1,2,3,4], so Visa (card 0) is at slot 0.
function triggerSelection() {
  const visaEl = cardEls[0];

  // ① Non-Visa cards exit downward, cascaded from slot 1 → slot 4
  slotToCard
    .filter(cardIdx => cardIdx !== 0)
    .forEach((cardIdx, i) => {
      const el = cardEls[cardIdx];
      gsap.to(el, {
        y:        parseFloat(gsap.getProperty(el, 'y')) + 310,
        opacity:  0,
        duration: 0.52,
        ease:     'power2.in',
        delay:    i * 0.06,
      });
    });

  // ② Visa: spring scale-up + border glow
  gsap.to(visaEl, {
    scale:    1.06,
    duration: 0.62,
    ease:     'back.out(2.5)',
    delay:    0.06,
    onStart() { visaEl.classList.add('is-selected'); },
  });

  // ③ Badge: float up into view
  gsap.to('#badge', {
    opacity:  1,
    y:        0,
    duration: 0.36,
    ease:     'power2.out',
    delay:    0.72,
  });
}
</script>
</body>
</html>
